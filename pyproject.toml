[project]
name = "cua"
version = "0.1.0"
description = "Record-once / replay-many computer-use automation for legacy back-office apps"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.47",
    "pydantic>=2.9",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
cua = "cua.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
