<!doctype html>
<meta charset="utf-8">
<title>Capability Console</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --ink:#16181d; --muted:#6b7280; --line:#e3e6eb;
  --accent:#2f5cff; --ok:#0e7a4a; --info:#1d5fb8; --warn:#9a6a00; --bad:#b3261e; --esc:#6d28d9;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1115;--panel:#171a21;--ink:#e8eaee;--muted:#9aa1ad;--line:#262b34;
        --accent:#7c9bff;--ok:#3ecf8e;--info:#69a5ff;--warn:#e2b53f;--bad:#ff7b72;--esc:#c4a5ff}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
     font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:baseline;gap:16px;padding:14px 20px;
       border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0;letter-spacing:-.01em}
header .sub{color:var(--muted);font-size:12px}
nav{margin-left:auto;display:flex;gap:4px}
nav button{border:1px solid transparent;background:none;color:var(--muted);
           padding:5px 12px;border-radius:7px;cursor:pointer;font:inherit;font-size:13px}
nav button[data-on=true]{background:var(--bg);color:var(--ink);border-color:var(--line)}
main{display:grid;grid-template-columns:290px 1fr;gap:16px;padding:16px 20px;
     align-items:start;max-width:1400px}
main.single{grid-template-columns:1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
         margin:0;padding:11px 14px;border-bottom:1px solid var(--line);font-weight:600}
.card .body{padding:14px}
.item{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item[data-on=true]{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.item .t{font-weight:600;font-size:13px}
.item .m{color:var(--muted);font-size:12px;margin-top:2px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input,select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;
             background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
button.go{background:var(--accent);color:#fff;border:0;border-radius:8px;
          padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
button.go[disabled]{opacity:.5;cursor:default}
button.ghost{background:none;border:1px solid var(--line);color:var(--ink);
             border-radius:7px;padding:6px 12px;font:inherit;cursor:pointer;font-size:13px}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;
       font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.b-success,.b-recovered{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.b-business_outcome{background:color-mix(in srgb,var(--info) 18%,transparent);color:var(--info)}
.b-hard_failure{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.b-blocked_by_policy{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.b-escalated{background:color-mix(in srgb,var(--esc) 18%,transparent);color:var(--esc)}
.b-draft{background:color-mix(in srgb,var(--muted) 18%,transparent);color:var(--muted)}
.b-approved{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;
   letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv div:nth-child(odd){color:var(--muted)}
.note{color:var(--muted);font-size:12px}
.warn{color:var(--warn);font-size:12px}
.out{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);
      border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite;
      vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.evt{display:grid;grid-template-columns:52px 130px 1fr;gap:10px;padding:5px 0;
     border-bottom:1px solid var(--line);font-size:12.5px}
.evt:last-child{border-bottom:0}
.evt .k{color:var(--muted);font-family:ui-monospace,monospace}
img.shot{max-width:100%;border:1px solid var(--line);border-radius:8px;margin-top:10px}
</style>
<div id="root"></div>
<script src="/vendor/react.js"></script>
<script src="/vendor/react-dom.js"></script>
<script src="/vendor/htm.js"></script>
<script>
const { useState, useEffect, useCallback } = React;
const html = htm.bind(React.createElement);

const api = {
  get: (p) => fetch(p).then(r => r.json()),
  post: (p, body) => fetch(p, {method:'POST', headers:{'Content-Type':'application/json'},
                              body: JSON.stringify(body)}).then(r => r.json()),
};

const Badge = ({v}) => html`<span class="badge b-${v}">${(v||'').replace(/_/g,' ')}</span>`;

// ---------------------------------------------------------------- capabilities
function RunForm({cap, onDone}) {
  const [args, setArgs] = useState({});
  const [busy, setBusy] = useState(false);
  const [result, setResult] = useState(null);

  // Start empty. An example is documentation, not a default: a form arriving
  // pre-filled with the member it was recorded against invites running it against
  // that member by simply not noticing.
  useEffect(() => { setArgs({}); setResult(null); }, [cap.id, cap.version]);

  const run = async () => {
    setBusy(true); setResult(null);
    const r = await api.post('/api/replay', {capability_id: cap.id, args});
    setResult(r); setBusy(false); onDone && onDone();
  };

  return html`
    <div class="card" style=${{marginTop:'16px'}}>
      <h2>Replay</h2>
      <div class="body">
        <div class="row">
          ${(cap.inputs||[]).map(p => html`
            <div key=${p.name}>
              <label>${p.name}${p.required ? '' : ' (optional)'}${p.sensitive ? ' · sensitive' : ''}</label>
              ${p.enum_values && p.enum_values.length
                ? html`<select value=${args[p.name]||''}
                         onChange=${e => setArgs({...args, [p.name]: e.target.value})}>
                    <option value="">— choose —</option>
                    ${p.enum_values.map(v => html`<option key=${v} value=${v}>${v}</option>`)}
                  </select>`
                : html`<input value=${args[p.name]||''} placeholder=${p.example||''}
                         onChange=${e => setArgs({...args, [p.name]: e.target.value})} />`}
              <div class="note" style=${{marginTop:'4px'}}>
                ${p.description}${p.example ? html`<span style=${{opacity:.7}}> (recorded with ${p.example} — not a default)</span>` : null}
              </div>
            </div>`)}
        </div>
        <div style=${{marginTop:'14px', display:'flex', gap:'10px', alignItems:'center'}}>
          <button class="go" disabled=${busy} onClick=${run}>
            ${busy ? html`<span class="spin"></span>` : null}${busy ? 'Running…' : 'Run replay'}
          </button>
          <span class="note">No model is consulted. Runs against ${cap.entry_url}</span>
        </div>
        ${result ? html`<${Result} r=${result} />` : null}
      </div>
    </div>`;
}

function Result({r}) {
  if (r.error) return html`<div class="out" style=${{marginTop:'14px'}}>
      <${Badge} v="hard_failure" /> <div class="mono" style=${{marginTop:'8px'}}>${r.error}</div></div>`;
  const outs = Object.entries(r.outputs || {});
  return html`
    <div class="out" style=${{marginTop:'14px'}}>
      <${Badge} v=${r.outcome} />
      <span class="note" style=${{marginLeft:'10px'}}>${r.duration_ms} ms</span>
      ${r.business_outcome ? html`<div style=${{marginTop:'10px'}}>
          <b>${r.business_outcome}</b> — <span class="note">${r.business_detail}</span>
          <div class="note" style=${{marginTop:'6px'}}>
            A declared answer, not a failure. The caller branches on the name.</div>
        </div>` : null}
      ${outs.length ? html`<table style=${{marginTop:'10px'}}>
          <thead><tr><th>output</th><th>value</th></tr></thead>
          <tbody>${outs.map(([k,v]) => html`<tr key=${k}><td class="mono">${k}</td>
            <td class="mono">${v}</td></tr>`)}</tbody></table>` : null}
      ${r.error ? html`<div style=${{marginTop:'10px'}}>
          <div class="mono">${r.error}</div>
          <div class="kv" style=${{marginTop:'8px'}}>
            <div>expected</div><div>${r.expected}</div>
            <div>observed</div><div>${r.observed}</div>
          </div></div>` : null}
      ${(r.recoveries||[]).length ? html`<div class="note" style=${{marginTop:'8px'}}>
          recovered from: ${r.recoveries.join(', ')}</div>` : null}
      ${(r.weak_steps||[]).length ? html`<div class="warn" style=${{marginTop:'8px'}}>
          steps ${r.weak_steps.join(', ')} only resolved via a low-confidence fallback —
          a drift warning even though the run passed</div>` : null}
      ${(r.steps||[]).length ? html`<table style=${{marginTop:'12px'}}>
          <thead><tr><th>#</th><th>action</th><th>found by</th><th>conf</th><th>check</th>
            <th>intent</th></tr></thead>
          <tbody>${r.steps.map(s => html`<tr key=${s.index}>
            <td class="mono">${s.index}</td><td class="mono">${s.action}</td>
            <td class="mono">${s.strategy || '—'}</td>
            <td class="mono">${s.confidence ? s.confidence.toFixed(2) : '—'}</td>
            <td>${s.checkpoint_passed === null ? '—' : (s.checkpoint_passed ? '✓' : '✗')}</td>
            <td class="note">${s.intent}</td></tr>`)}</tbody></table>` : null}
      ${r.evidence_dir ? html`<div class="note" style=${{marginTop:'10px'}}>
          evidence: <code>${r.evidence_dir.split('/').pop()}</code></div>` : null}
    </div>`;
}

function Capabilities({caps, reload}) {
  const [sel, setSel] = useState(null);
  const chosen = caps.find(c => c.id === sel) || caps[0];
  if (!caps.length) return html`<div class="card"><div class="body note">
      No capabilities yet. Record one with <code>cua discover</code>.</div></div>`;
  return html`
    <${React.Fragment}>
      <div class="card">
        <h2>Capabilities</h2>
        ${caps.map(c => html`
          <div class="item" key=${c.id} data-on=${chosen && c.id === chosen.id}
               onClick=${() => setSel(c.id)}>
            <div class="t">${c.name}</div>
            <div class="m mono">${c.id} · v${c.version}</div>
            <div style=${{marginTop:'6px'}}><${Badge} v=${c.approval} /></div>
          </div>`)}
      </div>
      <div>
        ${chosen ? html`<${Detail} cap=${chosen} reload=${reload} />` : null}
      </div>
    <//>`;
}

function Detail({cap, reload}) {
  return html`
    <${React.Fragment}>
      <div class="card">
        <h2>Contract</h2>
        <div class="body">
          <div style=${{fontSize:'15px',fontWeight:600}}>${cap.name}</div>
          <div class="note" style=${{margin:'4px 0 12px'}}>${cap.description}</div>
          <div class="kv">
            <div>id</div><div class="mono">${cap.id}</div>
            <div>version</div><div class="mono">v${cap.version} of ${cap.versions.join(', ')}</div>
            <div>fingerprint</div><div class="mono">${cap.fingerprint}</div>
            <div>surface</div><div class="mono">${cap.entry_url}</div>
            <div>steps</div><div class="mono">${cap.steps}</div>
            <div>recorded by</div><div class="mono">${cap.model || 'hand-recorded'}</div>
            <div>weakest locator</div>
            <div class="mono">${cap.weakest_locator != null ? cap.weakest_locator.toFixed(2) : '—'}</div>
          </div>
          ${cap.known_outcomes.length ? html`
            <div style=${{marginTop:'14px'}}>
              <label>Declared business outcomes</label>
              ${cap.known_outcomes.map(k => html`<div key=${k.name} class="note">
                <code>${k.name}</code> — ${k.description}</div>`)}
            </div>` : html`<div class="warn" style=${{marginTop:'14px'}}>
              No business outcomes declared — an unexpected condition will report as a
              hard failure. Derive them with <code>cua probe</code>.</div>`}
          ${cap.recoverable.length ? html`
            <div style=${{marginTop:'12px'}}>
              <label>Recoverable conditions</label>
              ${cap.recoverable.map(k => html`<div key=${k.name} class="note">
                <code>${k.name}</code> — ${k.description}</div>`)}
            </div>` : null}
          ${cap.problems.length ? html`<div class="warn" style=${{marginTop:'12px'}}>
              ${cap.problems.map((p,i) => html`<div key=${i}>⚠ ${p}</div>`)}</div>` : null}
        </div>
      </div>
      <${RunForm} cap=${cap} onDone=${reload} />
    <//>`;
}

// ------------------------------------------------------------------------ runs
function Runs({runs}) {
  const [open, setOpen] = useState(null);
  const [detail, setDetail] = useState(null);
  useEffect(() => { if (open) api.get(`/api/runs/${open}`).then(setDetail); }, [open]);
  return html`
    <${React.Fragment}>
      <div class="card">
        <h2>Runs</h2>
        ${runs.map(r => html`
          <div class="item" key=${r.id} data-on=${open === r.id} onClick=${() => setOpen(r.id)}>
            <div><${Badge} v=${r.outcome} /></div>
            <div class="m mono" style=${{marginTop:'5px'}}>${r.kind} · ${r.duration_ms} ms</div>
            <div class="m mono">${r.id}</div>
          </div>`)}
        ${runs.length ? null : html`<div class="body note">No runs yet.</div>`}
      </div>
      <div class="card">
        <h2>${open ? 'Run detail' : 'Select a run'}</h2>
        <div class="body">
          ${detail && detail.events ? html`
            <${React.Fragment}>
              ${detail.events.map(e => html`
                <div class="evt" key=${e.seq}>
                  <div class="k">${(e.elapsed_ms/1000).toFixed(1)}s</div>
                  <div class="k">${e.kind}</div>
                  <div>${e.message}</div>
                </div>`)}
              ${(detail.screenshots||[]).map(s => html`
                <img class="shot" key=${s} src=${`/evidence/${detail.id}/${s}`} alt=${s} />`)}
            <//>` : html`<div class="note">Pick a run to see its structured log.</div>`}
        </div>
      </div>
    <//>`;
}

// --------------------------------------------------------------- interventions
function Interventions({items, reload}) {
  const [operator, setOperator] = useState('mthompson');
  const [notes, setNotes] = useState('');
  return html`
    <div class="card">
      <h2>Interventions</h2>
      <div class="body">
        ${items.length ? null : html`<div class="note">
          No intervention requests. Replay with <code>--escalate</code> to create one when
          a run cannot continue on its own.</div>`}
        ${items.map(r => html`
          <div key=${r.id} class="out" style=${{marginBottom:'12px'}}>
            <div style=${{display:'flex',gap:'10px',alignItems:'center'}}>
              <${Badge} v=${r.state === 'open' ? 'escalated' : 'success'} />
              <code>${r.id}</code>
              <span class="note">${r.capability_id}</span>
            </div>
            <div class="kv" style=${{marginTop:'10px'}}>
              <div>why</div><div>${r.reason}</div>
              <div>step</div><div>${r.step_index} — ${r.step_intent}</div>
              <div>expected</div><div>${r.expected}</div>
              <div>observed</div><div>${r.observed}</div>
              <div>session</div><div>${r.session_hint}</div>
              ${r.operator ? html`<${React.Fragment}><div>held by</div>
                <div>${r.operator}</div><//>` : null}
            </div>
            ${r.human_changes && r.human_changes.length ? html`
              <div style=${{marginTop:'10px'}}><label>What the operator changed</label>
                ${r.human_changes.map((c,i) => html`<div key=${i} class="note">• ${c}</div>`)}
              </div>` : null}
            ${r.state === 'open' ? html`
              <div style=${{marginTop:'10px',display:'flex',gap:'8px'}}>
                <input style=${{maxWidth:'180px'}} value=${operator}
                       onChange=${e => setOperator(e.target.value)} />
                <button class="ghost" onClick=${async () => {
                  await api.post('/api/interventions/claim', {id:r.id, operator}); reload();
                }}>Take control</button>
              </div>` : null}
            ${r.state === 'claimed' ? html`
              <div style=${{marginTop:'10px',display:'flex',gap:'8px'}}>
                <input placeholder="what you did" value=${notes}
                       onChange=${e => setNotes(e.target.value)} />
                <button class="ghost" onClick=${async () => {
                  await api.post('/api/interventions/release', {id:r.id, notes}); reload();
                }}>Hand back</button>
              </div>` : null}
          </div>`)}
      </div>
    </div>`;
}

// ------------------------------------------------------------------------ demo
// The assistant. A model runs here, deciding *what* to do - which capability answers a
// question, and what its arguments are. Carrying it out is still a deterministic
// replay. When nothing fits, the assistant learns the flow once and the new capability
// joins the list below, so the same question is a replay ever after.

// Deliberately no list of members or accounts here. Shipping customer identifiers in
// a dropdown is both a data-handling problem and a fiction - a real deployment has no
// idea who the caller will ask about. The fields below are rendered from the selected
// capability's declared inputs, so the contract decides what is asked for and which
// values are constrained.

function Bubble({who, children, meta, tone}) {
  const mine = who === 'you';
  const border = tone === 'unsure' ? 'var(--warn)'
               : tone === 'answer' ? 'var(--ok)' : 'var(--line)';
  return html`
    <div style=${{display:'flex', justifyContent: mine ? 'flex-end':'flex-start',
                  margin:'8px 0'}}>
      <div style=${{maxWidth:'80%', padding:'9px 13px', borderRadius:'13px',
                    background: mine ? 'var(--accent)' : 'var(--bg)',
                    color: mine ? '#fff' : 'var(--ink)',
                    border: mine ? 'none' : `1px solid ${border}`}}>
        <div>${children}</div>
        ${meta ? html`<div style=${{marginTop:'6px', fontSize:'11px', opacity:.75}}>${meta}</div>` : null}
      </div>
    </div>`;
}

function Assistant({caps, reload}) {
  const [chosen, setChosen] = useState('');
  const [args, setArgs] = useState({});
  const [other, setOther] = useState('');
  const [log, setLog] = useState([]);
  const [busy, setBusy] = useState(false);
  const [learning, setLearning] = useState(null);

  const selected = caps.find(c => c.id === chosen) || caps[0];
  const say = (entry) => setLog(l => [...l, entry]);

  // Switching capability clears the values - carrying a member number across from a
  // different request is exactly the kind of quiet mistake this form should not make.
  useEffect(() => { setArgs({}); }, [selected && selected.id]);

  const missingArgs = () => (selected ? (selected.inputs || []) : [])
    .filter(p => p.required && !(args[p.name] || '').trim())
    .map(p => p.name);

  // Narrate a discovery run while it works, then answer with what it learned.
  useEffect(() => {
    if (!learning) return;
    const timer = setInterval(async () => {
      const s = await api.get(`/api/discover/${learning.run_id}`);
      const turns = (s.events||[]).filter(e => e.kind === 'acted').length;
      setLearning(l => l && ({...l, turns, events: s.events || []}));
      if (!s.done) return;
      clearInterval(timer);
      const {capability_id, args} = learning;
      setLearning(null);
      reload();
      if (s.ok) {
        say({who:'bot', text:`Worked it out — ${turns} steps on screen. Saved as a capability, so it is in the list now and this question is a replay from here on.`});
        answerWith(capability_id, args);
      } else {
        say({who:'bot', tone:'unsure',
             text:`I could not work that out on my own, so I would rather not answer. ${s.error}`});
        setBusy(false);
      }
    }, 3000);
    return () => clearInterval(timer);
  }, [learning && learning.run_id]);

  const answerWith = async (capability_id, args) => {
    const started = performance.now();
    const r = await api.post('/api/replay', {capability_id, args});
    const secs = ((performance.now() - started)/1000).toFixed(1);
    setBusy(false);
    reload();

    if (r.error && !r.outcome)
      return say({who:'bot', tone:'unsure', text:r.error});

    if (r.outcome === 'business_outcome')
      return say({who:'bot',
        text:`${r.business_detail} Reported by name as “${r.business_outcome}”, so it is an answer rather than a fault.`,
        meta:`${secs}s · no model consulted`});

    if (r.outcome === 'success' || r.outcome === 'recovered') {
      const outs = Object.entries(r.outputs || {});
      const bits = [`${secs}s`, 'no model consulted', `${r.capability_id} v${r.version}`];
      if ((r.recoveries||[]).length) bits.push(`recovered from ${r.recoveries.join(', ')}`);
      if ((r.weak_steps||[]).length) bits.push(`weak steps ${r.weak_steps.join(', ')}`);
      return say({who:'bot', tone:'answer', meta:bits.join(' · '),
        children: html`<div>
          ${outs.map(([k,v]) => html`<div key=${k}>
            <span style=${{opacity:.7}}>${k.replace(/_/g,' ')}:</span> <b>${v}</b></div>`)}
        </div>`});
    }

    return say({who:'bot', tone:'unsure',
      text:`I could not complete that: ${r.error || r.outcome}.`,
      meta:`${secs}s · evidence saved`});
  };

  // Only values the operator actually typed. An example recorded at discovery time is
  // never substituted: doing so would run the capability against whatever record it was
  // recorded from rather than the one being asked about, and the answer would read
  // perfectly plausibly while being about somebody else's account.

  const askFreeText = async (q) => {
    const route = await api.post('/api/ask', {question: q});
    if (route.error) { say({who:'bot', tone:'unsure', text:route.error}); setBusy(false); return; }

    if (route.can_answer) {
      say({who:'bot', text:'I know how to do that.',
           meta:`matched ${route.capability_id} · ${route.confidence} confidence`});
      return answerWith(route.capability_id, route.arguments);
    }
    // Matched, but the question left something out. Never invent it - an invented
    // member number is a lookup of somebody else's account.
    if (route.capability_id && route.missing.length) {
      say({who:'bot', tone:'unsure',
           text:`I can do that, but you have not told me: ${route.missing.join(', ')}. I would rather ask than guess.`});
      setBusy(false); return;
    }
    if (route.capability_id) {
      say({who:'bot', tone:'unsure',
           text:`I am not confident enough to answer that. ${route.reasoning}`,
           meta:`closest match ${route.capability_id} · ${route.confidence} confidence`});
      setBusy(false); return;
    }
    if (!route.goal) {
      say({who:'bot', tone:'unsure',
           text:`I do not have a capability for that, and I could not work out what it would involve. ${route.reasoning}`});
      setBusy(false); return;
    }
    say({who:'bot',
         text:'I have not done that here before. Let me work it out by using the application — this takes a while, and only has to happen once.',
         meta:`will record as ${route.suggested_id}`});
    const started = await api.post('/api/discover', {
      capability_id: route.suggested_id,
      url: (selected && selected.entry_url) || 'http://127.0.0.1:8080/meridian/',
      goal: route.goal, params: route.arguments, max_steps: 10,
    });
    if (started.error) { say({who:'bot', tone:'unsure', text:started.error}); setBusy(false); return; }
    setLearning({run_id: started.run_id, capability_id: route.suggested_id,
                 args: route.arguments, turns: 0, events: []});
  };

  const ask = async () => {
    const typed = other.trim();
    setBusy(true);
    if (typed) {                       // the escape hatch takes precedence
      say({who:'you', text:typed});
      setOther('');
      return askFreeText(typed);
    }
    if (!selected) {
      say({who:'bot', tone:'unsure',
           text:'Nothing is recorded yet — type what you need below and I will learn it.'});
      setBusy(false); return;
    }
    const gaps = missingArgs();
    if (gaps.length) {
      say({who:'bot', tone:'unsure',
           text:`I need ${gaps.join(' and ')} before I can run that. I will not fill it in from the value it was recorded with — that would answer about a different account.`});
      setBusy(false); return;
    }
    const supplied = Object.fromEntries(
      (selected.inputs || []).map(p => [p.name, (args[p.name] || '').trim()]));
    say({who:'you', text:`${selected.description} — ` +
         Object.entries(supplied).map(([k,v]) => `${k} ${v}`).join(', ')});
    say({who:'bot', text:'I know how to do that.'});
    return answerWith(selected.id, supplied);
  };

  return html`
    <${React.Fragment}>
      <div class="card">
        <h2>Ask</h2>
        <div class="body">
          <label>Request</label>
          <select value=${selected ? selected.id : ''} onChange=${e => setChosen(e.target.value)}>
            ${caps.length
              ? caps.map(c => html`<option key=${c.id} value=${c.id}>${c.description}</option>`)
              : html`<option value="">nothing recorded yet</option>`}
          </select>

          ${selected ? (selected.inputs || []).map(p => html`
            <div key=${p.name} style=${{marginTop:'10px'}}>
              <label>${p.name.replace(/_/g,' ')}${p.required ? '' : ' (optional)'}</label>
              ${p.enum_values && p.enum_values.length
                ? html`<select value=${args[p.name] || ''}
                         onChange=${e => setArgs({...args, [p.name]: e.target.value})}>
                    <option value="">— choose —</option>
                    ${p.enum_values.map(v => html`<option key=${v} value=${v}>${v}</option>`)}
                  </select>`
                : html`<input value=${args[p.name] || ''} placeholder=${p.example ? `e.g. ${p.example}` : ''}
                         onChange=${e => setArgs({...args, [p.name]: e.target.value})} />`}
              <div class="note" style=${{marginTop:'3px'}}>${p.description}</div>
            </div>`) : null}

          <div style=${{height:'16px', borderTop:'1px solid var(--line)', margin:'14px 0 0'}}></div>
          <label>Not in the list? Ask for it</label>
          <textarea rows="2" value=${other}
            placeholder="e.g. is member 12345's debit card locked?"
            onChange=${e => setOther(e.target.value)}
            style=${{width:'100%',padding:'8px 10px',border:'1px solid var(--line)',
                     borderRadius:'7px',background:'var(--bg)',color:'var(--ink)',
                     font:'inherit',fontSize:'13px',resize:'vertical'}}></textarea>
          <div class="note" style=${{marginTop:'5px'}}>
            Used instead of the selections above. If nothing recorded answers it, I will
            drive the application once to learn it and add it to the list.
          </div>

          <div style=${{marginTop:'14px'}}>
            <button class="go" disabled=${busy} onClick=${ask}>
              ${busy ? html`<span class="spin"></span>` : null}${busy ? 'Working…' : 'Ask'}
            </button>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Assistant</h2>
        <div class="body">
          ${log.length ? null : html`<div class="note">
            Pick a request and ask — a recorded capability answers in seconds with no
            model involved. For anything not in the list, type it below the selections
            and I will work it out once, then remember it.</div>`}
          ${log.map((m,i) => html`
            <${Bubble} key=${i} who=${m.who} meta=${m.meta} tone=${m.tone}>
              ${m.children || m.text}
            <//>`)}
          ${learning ? html`
            <div class="out" style=${{marginTop:'10px'}}>
              <div><span class="spin"></span>Using the application — ${learning.turns} steps so far</div>
              <div class="note" style=${{marginTop:'8px'}}>
                ${(learning.events||[]).slice(-4).map((e,i) => html`
                  <div key=${i}>${e.kind} · ${(e.message||'').slice(0,70)}</div>`)}
              </div>
            </div>` : null}
        </div>
      </div>
    <//>`;
}

// ------------------------------------------------------------------------- app
function App() {
  const [tab, setTab] = useState('demo');
  const [caps, setCaps] = useState([]);
  const [runs, setRuns] = useState([]);
  const [ivs, setIvs] = useState([]);

  const reload = useCallback(() => {
    api.get('/api/capabilities').then(setCaps);
    api.get('/api/runs').then(setRuns);
    api.get('/api/interventions').then(setIvs);
  }, []);
  useEffect(() => { reload(); const t = setInterval(reload, 4000); return () => clearInterval(t); },
            [reload]);

  const tabs = [['demo','Assistant'],['capabilities','Capabilities'],
                ['runs',`Runs (${runs.length})`],
                ['interventions',`Interventions (${ivs.filter(i=>i.state==='open').length})`]];
  return html`
    <${React.Fragment}>
      <header>
        <h1>Capability Console</h1>
        <span class="sub">record once · replay many · no model on this path</span>
        <nav>${tabs.map(([k,l]) => html`
          <button key=${k} data-on=${tab===k} onClick=${() => setTab(k)}>${l}</button>`)}</nav>
      </header>
      <main class=${tab === 'interventions' ? 'single' : ''}>
        ${tab === 'demo' ? html`<${Assistant} caps=${caps} reload=${reload} />` : null}
        ${tab === 'capabilities' ? html`<${Capabilities} caps=${caps} reload=${reload} />` : null}
        ${tab === 'runs' ? html`<${Runs} runs=${runs} />` : null}
        ${tab === 'interventions' ? html`<${Interventions} items=${ivs} reload=${reload} />` : null}
      </main>
    <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
