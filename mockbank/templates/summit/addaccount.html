{% include 'summit/_chrome.html' %}
<body>
<form name="relatedAccountForm" method="post" action="{{ url_for('summit.add_submit') }}">
<input type="hidden" name="org.apache.struts.taglib.html.TOKEN" value="{{ token }}">
<input type="hidden" name="customerNbr" value="{{ m.member_id }}">
<table class="outer" width="100%" cellpadding="0" cellspacing="0"><tr><td>
  <table width="100%" cellpadding="0" cellspacing="0">
    <tr><td class="sect" colspan="2">Add Related Account &mdash; {{ m.last_name }}, {{ m.first_name }}</td></tr>
    <tr><td class="cap">Product Code:</td>
        <td><select name="productCd">
          <option value="">-- select --</option>
          <option value="Savings"{% if form.acct_type=='Savings' %} selected{% endif %}>SAV Savings</option>
          <option value="Checking"{% if form.acct_type=='Checking' %} selected{% endif %}>DDA Checking</option>
          <option value="Certificate"{% if form.acct_type=='Certificate' %} selected{% endif %}>CTF Certificate</option>
        </select></td></tr>
    <tr><td class="cap">Opening Amount:</td>
        <td><input type="text" name="openingAmt" size="14" maxlength="12" value="{{ form.initial|e }}"></td></tr>
    {% if errors %}<tr><td colspan="2" class="msg">
      {% for e in errors %}&raquo; {{ e }}<br>{% endfor %}</td></tr>{% endif %}
    <tr><td colspan="2">
      <input type="submit" name="submitAction" value="Post" class="b">
      <input type="submit" name="submitAction" value="Abandon" class="b">
    </td></tr>
  </table>
</td></tr></table>
</form>
</body>
